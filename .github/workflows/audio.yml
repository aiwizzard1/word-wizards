name: Generate word audio
on:
  push:
    paths: ["words.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audio
  cancel-in-progress: false
jobs:
  audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate missing clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python3 scripts/gen_audio.py
      - name: Commit new clips
        run: |
          git config user.name "word-wizards-bot"
          git config user.email "bot@users.noreply.github.com"
          git add audio
          git diff --cached --quiet || (git commit -m "Add voice clips for new words" && git pull --rebase -q && git push)
