<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Word Wizards - Grammar &amp; Spelling Practice</title>
<style>
:root{
  --bg:#fdf6e3; --ink:#2b2d42; --card:#fff; --accent:#6c5ce7; --good:#2ecc71; --bad:#e74c3c;
  --n:#2d6cdf; --v:#e0392b; --adj:#2e9e4f; --adv:#e08a00; --prep:#8e44ad; --pro:#d6336c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:20px}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--accent);color:#fff;position:sticky;top:0;z-index:5}
header h1{font-size:22px;margin:0;cursor:pointer}
#stars{font-weight:bold;font-size:20px}
main{max-width:860px;margin:0 auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 3px 10px #0002}
.menu-card{cursor:pointer;text-align:center;border:3px solid transparent;transition:transform .1s}
.menu-card:active{transform:scale(.97)}
.menu-card .big{font-size:48px}
.menu-card h2{margin:6px 0 4px;font-size:22px}
.menu-card p{margin:0;font-size:16px;color:#555}
button{font:inherit;cursor:pointer;border:none;border-radius:14px;padding:10px 18px;background:var(--accent);color:#fff;font-weight:bold}
button.sec{background:#dfe4ea;color:var(--ink)}
button.good{background:var(--good)}
button:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.q{font-size:24px;margin:8px 0 16px}
.sentence{font-size:30px;line-height:2.1;text-align:center}
.w{display:inline-block;padding:0 7px;border-radius:10px;cursor:pointer;border:3px solid transparent}
.w:hover{background:#eee}
.w.n{background:var(--n);color:#fff}.w.v{background:var(--v);color:#fff}.w.adj{background:var(--adj);color:#fff}
.w.adv{background:var(--adv);color:#fff}.w.prep{background:var(--prep);color:#fff}.w.pro{background:var(--pro);color:#fff}
.w.conj{background:#0a8f8f;color:#fff}.w.interj{background:#7f6000;color:#fff}
.vbar.slant{height:50px;margin-top:0;transform-origin:bottom;transform:rotate(-25deg) translateX(8px)}
.w.wrong{animation:shake .4s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gap{display:inline-block;width:22px;height:44px;vertical-align:middle;cursor:pointer;position:relative}
.gap:hover::after{content:"";position:absolute;left:9px;top:2px;bottom:2px;width:4px;background:var(--accent);border-radius:3px}
.gap.show::after{content:"";position:absolute;left:9px;top:-4px;bottom:-4px;width:5px;background:var(--bad);border-radius:3px}
.subj{color:var(--n);font-weight:bold}.pred{color:var(--v);font-weight:bold}
.msg{min-height:56px;font-size:20px;margin:10px 0;padding:10px 14px;border-radius:14px}
.msg.ok{background:#d5f5e3}.msg.no{background:#fadbd8}.msg.info{background:#eaf2ff}
.progress{height:12px;background:#e5e5e5;border-radius:8px;overflow:hidden;margin-bottom:14px}
.progress>div{height:100%;background:var(--good);transition:width .3s}
input[type=text],textarea{font:inherit;font-size:28px;padding:10px 14px;border:3px solid #ccd;border-radius:14px;width:100%;text-align:center}
textarea{font-size:18px;text-align:left}
.diff b{color:var(--bad);text-decoration:underline}
.legend span{padding:2px 10px;border-radius:10px;color:#fff;font-size:16px;margin:2px;display:inline-block}
.opt{display:block;width:100%;margin:8px 0;background:#fff;color:var(--ink);border:3px solid #ccd;font-size:24px}
.opt.right{background:#d5f5e3;border-color:var(--good)}.opt.wrong{background:#fadbd8;border-color:var(--bad)}
.tag{display:inline-block;background:#eaf2ff;padding:4px 12px;border-radius:12px;font-size:16px;margin:3px}
.back{margin-bottom:10px}
/* diagram */
.diagram{background:#fff;border-radius:18px;padding:20px 14px 30px;overflow-x:auto;box-shadow:inset 0 0 0 3px #eef}
.main{display:flex;align-items:flex-start;gap:0;min-width:max-content;margin:0 auto;width:max-content}
.col{display:flex;flex-direction:column;align-items:flex-start}
.slot{min-width:96px;min-height:46px;border-bottom:4px solid var(--ink);display:flex;align-items:flex-end;justify-content:center;padding:0 8px 2px;font-size:22px;font-weight:bold;cursor:pointer;position:relative;text-align:center}
.slot .ph{font-size:12px;color:#aab;font-weight:normal;letter-spacing:.5px}
.slot.sel-target{background:#f3f0ff}
.slot.ok{background:#d5f5e3}.slot.bad{background:#fadbd8}
.vbar{width:4px;background:var(--ink);align-self:flex-start;margin-top:-8px}
.vbar.full{height:66px}.vbar.half{height:50px;margin-top:0}
.mods{display:flex;flex-direction:column;margin-top:4px;margin-left:20px}
.slot.mod,.slot.prep{margin-top:6px;min-height:40px;margin-left:12px}
.slot.mod::before,.slot.prep::before{content:"";position:absolute;left:-2px;bottom:-4px;width:4px;height:44px;background:var(--ink);transform-origin:bottom;transform:rotate(30deg) translateX(-14px)}
.prepwrap{display:flex;align-items:flex-start;margin-top:4px;margin-left:20px}
.prepwrap .pobj{margin-left:6px}
.bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0;min-height:60px}
.chip{background:#fff;color:var(--ink);border:3px solid var(--accent);font-size:24px;padding:8px 16px}
.chip.sel{background:var(--accent);color:#fff}
.chip.used{visibility:hidden}
.lvl{display:inline-block;padding:6px 14px;border-radius:12px;background:#dfe4ea;margin:3px;cursor:pointer;font-size:16px}
.lvl.on{background:var(--accent);color:#fff}
.pop{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:90px;pointer-events:none;animation:pop .9s forwards;z-index:20}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
small.help{color:#666;font-size:15px}
</style>
</head>
<body>
<header><h1 onclick="home()">🧙 Word Wizards</h1><div id="stars"></div></header>
<main id="app"></main>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = JSON.parse(localStorage.getItem('wordwizards') || '{"stars":0,"missed":{},"custom":[],"dlevel":0,"ddone":{}}');
const save = () => { localStorage.setItem('wordwizards', JSON.stringify(store)); $('#stars').textContent = '⭐ ' + store.stars; };
const cheer = ["Great job!", "You got it!", "Nice work!", "Super!", "Awesome!", "Brilliant!"];
const rc = () => cheer[Math.floor(Math.random() * cheer.length)];
function star(n = 1) {
  store.stars += n; save();
  const p = document.createElement('div'); p.className = 'pop'; p.textContent = '⭐'; document.body.appendChild(p);
  setTimeout(() => p.remove(), 900);
}
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|wobble|fred|good news|jester|junior|organ|superstar|ralph|trinoids|whisper|zarvox|hysterical|pipe|deranged|kathy|princess|bruce|agnes|vicki|victoria|compact/i;
const PREFERRED = [/natural|neural|online/i, /premium|enhanced|siri/i, /google us english/i, /\b(ava|zoe|allison|susan|nicky|samantha|aria|jenny|joanna|ivy|kendra|salli)\b/i];
function englishVoices() { return (window.speechSynthesis ? speechSynthesis.getVoices() : []).filter(v => /^en[-_]/i.test(v.lang) && !NOVELTY.test(v.name)); }
function rank(v) { for (let i = 0; i < PREFERRED.length; i++) if (PREFERRED[i].test(v.name)) return i; return PREFERRED.length + (/en[-_]US/i.test(v.lang) ? 0 : 1); }
function bestVoice() {
  const vs = englishVoices();
  if (store.voice) { const m = vs.find(v => v.name === store.voice); if (m) return m; }
  return vs.slice().sort((a, b) => rank(a) - rank(b))[0];
}
let AUDIO = null, clip = null;
const SYNC_URL = 'https://word-wizards-sync.wordwizards-family.workers.dev';
function loadManifest() { return fetch('audio/manifest.json?t=' + Date.now()).then(r => r.json()).then(m => { AUDIO = m; }).catch(() => {}); }
loadManifest();
fetch('words.txt?t=' + Date.now()).then(r => r.ok ? r.text() : '').then(t => {
  const w = t.split('\n').map(x => x.trim()).filter(Boolean);
  if (w.length) { store.custom = w; save(); }
}).catch(() => {});
function say(text) {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (clip) clip.pause();
  const f = AUDIO && AUDIO[String(text).trim().toLowerCase()];
  if (!f) return ttsSay(text);
  clip = new Audio('audio/' + f); clip.playbackRate = 0.95;
  clip.play().catch(() => ttsSay(text));
}
function ttsSay(text) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text); const v = bestVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
  u.rate = 0.9; u.pitch = 1.05;
  speechSynthesis.speak(u);
}
if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
function voiceMenu() {
  const vs = englishVoices().sort((a, b) => rank(a) - rank(b)); const cur = bestVoice();
  app.innerHTML = `${backBtn}<h2>🔊 Voice</h2><p>Pick the voice that sounds best. Names with "Natural", "Premium", "Enhanced" or "Siri" usually sound the most human.</p>
  <div class="card">${vs.length ? vs.map((v, k) => `<div class="row" style="margin:6px 0"><button class="opt ${cur && cur.name === v.name ? 'right' : ''}" style="flex:1;margin:0;font-size:20px" onclick="pickVoice(${k})">${esc(v.name)} <small>(${esc(v.lang)})</small></button><button class="sec" onclick="testVoice(${k})">▶ Test</button></div>`).join('') : '<p>No voices found on this device.</p>'}</div>
  <p><small class="help">On iPad: Settings &gt; Accessibility &gt; Spoken Content &gt; Voices to download better ones, then reload this page.</small></p>`;
  window._vs = vs;
}
function testVoice(k) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance('Spell the word because. I smiled because I was happy.'); u.voice = _vs[k]; u.lang = _vs[k].lang; u.rate = 0.9; u.pitch = 1.05; speechSynthesis.speak(u); }
function pickVoice(k) { store.voice = _vs[k].name; save(); voiceMenu(); }
const bar = (i, n) => `<div class="progress"><div style="width:${(i / n) * 100}%"></div></div>`;
const backBtn = `<button class="sec back" onclick="home()">← Home</button>`;
function sentenceWords(s) { return s.split(' '); }

/* ---------- home ---------- */
function home() {
  speechSynthesis && speechSynthesis.cancel();
  app.innerHTML = `
  <p class="center q">What would you like to practice today?</p>
  <div class="grid">
    <div class="card menu-card" onclick="spellMenu()"><div class="big">🐝</div><h2>Spelling Bee</h2><p>Listen, then spell the word</p></div>
    <div class="card menu-card" onclick="posStart()"><div class="big">🎨</div><h2>Parts of Speech</h2><p>Find nouns, verbs, adjectives and more</p></div>
    <div class="card menu-card" onclick="spStart()"><div class="big">✂️</div><h2>Subject &amp; Predicate</h2><p>Split the sentence in two</p></div>
    <div class="card menu-card" onclick="diagStart()"><div class="big">📐</div><h2>Sentence Diagrams</h2><p>Build the diagram, step by step</p></div>
    <div class="card menu-card" onclick="choiceStart('skills')"><div class="big">🧩</div><h2>Sentence Skills</h2><p>Sentence types, fragments, verb types</p></div>
    <div class="card menu-card" onclick="choiceStart('parts')"><div class="big">🔤</div><h2>Word Parts</h2><p>Prefixes, suffixes and roots</p></div>
    <div class="card menu-card" onclick="choiceStart('words')"><div class="big">🎯</div><h2>Pick the Right Word</h2><p>their / there, to / too / two...</p></div>
  </div>
  <p class="center"><button class="sec" onclick="voiceMenu()">🔊 Change voice</button><br><small class="help">Your stars are saved on this device.</small></p>`;
}

/* ---------- SPELLING ---------- */
const g = (tip, list) => list.map(([w, s]) => [w, s, tip]);
const SPELL = {
  "Q Rule": g("Riggs rule: The letter q is always followed by u, and we say 'kw'.", [["quiet","Please be quiet."],["quick","The rabbit is quick."],["queen","The queen wore a crown."],["quilt","Grandma made a quilt."],["square","Draw a square."],["quit","Never quit trying."]]),
  "C and G say s and j": g("Riggs rules: c before e, i or y says 's'. g before e, i or y may say 'j'.", [["chance","Give me a chance."],["icing","The cake has icing."],["icy","The road is icy."],["city","We live in a city."],["germ","A germ is tiny."],["giant","The giant was huge."],["gym","We play in the gym."],["giraffe","The giraffe is tall."]]),
  "Double l, f, s": g("Riggs rule: We often double l, f and s after a single vowel at the end of a one-syllable word.", [["ball","Throw the ball."],["off","Turn off the light."],["miss","I miss you."],["bell","The bell rang."],["stuff","Pack your stuff."],["grass","The grass is green."],["fall","Leaves fall in autumn."],["mess","What a mess!"]]),
  "ck and dge": g("Riggs rules: ck and dge are used only after a single short vowel.", [["pack","Pack your bag."],["rock","I found a rock."],["duck","The duck swam."],["black","The cat is black."],["badge","The sheriff wore a badge."],["ledge","The bird sat on the ledge."],["bridge","We crossed the bridge."],["fudge","I love chocolate fudge."]]),
  "sh, ti, si, ci say 'sh'": g("Riggs rules: sh is used at the beginning or end of a syllable. ti, si and ci say 'sh' at the beginning of any syllable after the first.", [["wish","Make a wish."],["fish","The fish swam."],["friendship","Their friendship is strong."],["nation","Our nation is big."],["station","We waited at the station."],["vacation","We went on vacation."],["mansion","The mansion is huge."],["facial","She made a funny facial expression."]]),
  "Doubling rule": g("Riggs rule: When a one-syllable word ends with one short vowel and one consonant, double the final consonant before a vowel ending.", [["hopping","The frog is hopping."],["running","The dog is running."],["stopped","The bus stopped."],["planned","We planned a trip."],["swimming","We are swimming."],["sitting","The cat is sitting."]]),
  "Doubling in two-syllable words": g("Riggs rule: In a two-syllable word, double the final consonant if the accent is on the last syllable.", [["admitted","He admitted his mistake."],["beginning","This is the beginning."],["forgetting","I keep forgetting my hat."],["occurred","It occurred yesterday."],["controlled","She controlled the puppet."]]),
  "Drop the silent e": g("Riggs rule: Silent final e words are written without the e when adding an ending that begins with a vowel.", [["having","We are having fun."],["making","She is making a cake."],["hoping","I am hoping for snow."],["writing","He is writing a story."],["using","She is using a pencil."],["taking","He is taking a nap."]]),
  "Y changes to i": g("Riggs rule: When adding an ending to a word that ends in y with its own sound, change y to i, unless the ending is -ing.", [["fried","Dad fried an egg."],["cried","The baby cried."],["carried","He carried the box."],["babies","The babies slept."],["families","Many families came."],["stories","I love stories."],["crying","The baby is crying."],["hurried","We hurried home."]]),
  "-ed says d or t": g("Riggs rule: The letters ed say 'd' or 't' as the past tense ending of a word that does not end in the sound d or t.", [["loved","She loved the gift."],["wrapped","I wrapped the present."],["jumped","He jumped high."],["played","We played outside."],["walked","They walked home."],["cleaned","He cleaned his room."]]),
  "ay at the end": g("Riggs rule: Base words do not end in a saying 'ay' (except the word a). We use ay most often.", [["may","May I go?"],["pay","I will pay."],["say","What did you say?"],["play","Let us play."],["stay","Please stay."],["birthday","Happy birthday!"]]),
  "Prefixes un-, non-, en-": g("Prefixes: un- and non- mean 'not'. en- means 'to make or put into'.", [["unhappy","He was unhappy."],["unfair","That is unfair."],["unlock","Unlock the door."],["nonstop","It was a nonstop flight."],["nonsense","That is nonsense."],["enjoy","I enjoy music."],["enlarge","Enlarge the picture."],["encourage","Teachers encourage students."]]),
  "Suffixes -ly, -y, -ful, -less": g("Suffixes: -ly = in a way. -y = full of. -ful = full of. -less = without.", [["slowly","The turtle moved slowly."],["quickly","He ran quickly."],["gently","She held it gently."],["rainy","It was a rainy day."],["careful","Be careful."],["helpful","She is helpful."],["hopeless","It seemed hopeless."],["fearless","The knight was fearless."]]),
  "-able and -ible": g("Suffixes -able and -ible both mean 'able to be'.", [["comfortable","The couch is comfortable."],["readable","His writing is readable."],["enjoyable","It was enjoyable."],["possible","Is it possible?"],["visible","The moon is visible."],["terrible","What a terrible storm."]]),
  "Word roots: arch and graph": g("Root arch means ruler or chief. Root graph means write or draw.", [["monarch","The monarch ruled the land."],["anarchy","Without laws, there is anarchy."],["hierarchy","The army has a hierarchy."],["autograph","She signed an autograph."],["photograph","Take a photograph."],["paragraph","Write one paragraph."],["biography","I read a biography."]]),
  "Tricky words": g("Learn this one by heart. Say it in parts as you spell it.", [["because","I smiled because I was happy."],["through","We walked through the door."],["thought","I thought about it."],["different","Cats and dogs are different."],["favorite","Blue is my favorite color."],["beautiful","What a beautiful day!"],["again","Say it again."],["enough","I have had enough."],["laugh","It made me laugh."],["friend","She is my friend."],["believe","I believe you."],["neighbor","My neighbor waved."]]),
  "Words that sound the same": g("Homophones sound the same but have different spellings and meanings. Use the sentence to decide.", [["their","It is their house."],["there","Put it over there."],["they're","They're coming soon."],["hear","I hear music."],["here","Come over here."],["write","Write your name."],["right","Turn right."],["knew","I knew the answer."],["new","I got new shoes."]])
};
let sp = null;
function spellGroups() { const g = Object.keys(SPELL); if (store.custom.length) g.unshift("My school list"); return g; }
function spellMenu() {
  const groups = spellGroups();
  app.innerHTML = `${backBtn}<h2>🐝 Spelling Bee</h2><p>Pick a word group. You will hear each word, then type it.</p>
  <div class="grid">${groups.map((g, k) => `<div class="card menu-card" onclick="spellStart(${k})"><h2>${esc(g)}</h2><p>${g === "My school list" ? store.custom.length : SPELL[g].length} words</p></div>`).join('')}
  <div class="card menu-card" onclick='spellStart("Mix")'><h2>🎲 Mix of everything</h2><p>Words you missed come back first</p></div></div>
  <div class="card" style="margin-top:18px"><b>Add this week's school spelling list</b><br><small class="help">One word per line.</small>
  <textarea id="custom" rows="5">${esc(store.custom.join('\n'))}</textarea><br><br><button onclick="saveCustom()">Save list</button> <small id="syncmsg" class="help"></small></div>`;
}
function saveCustom() {
  store.custom = $('#custom').value.split('\n').map(s => s.trim()).filter(Boolean); save(); spellMenu();
  syncList();
}
async function syncList() {
  const msg = t => { const e = $('#syncmsg'); if (e) e.textContent = t; };
  if (!SYNC_URL) return;
  let pass = localStorage.getItem('wwpass') || prompt('Family passcode (to share the list and get the new voice):');
  if (!pass) return;
  msg('Saving…');
  try {
    const r = await fetch(SYNC_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ passcode: pass, words: store.custom }) });
    if (r.status === 401) { localStorage.removeItem('wwpass'); msg('Wrong passcode.'); return; }
    if (!r.ok) throw 0;
    localStorage.setItem('wwpass', pass);
    msg('Saved. New voice clips ready in about a minute.');
    setTimeout(loadManifest, 90000);
  } catch (e) { msg('Saved on this device only.'); }
}
function spellStart(group) {
  if (typeof group === 'number') group = spellGroups()[group];
  let pool;
  if (group === "My school list") pool = store.custom.map(w => [w, '', 'Sound it out slowly, one syllable at a time.']);
  else if (group === "Mix") pool = Object.values(SPELL).flat().concat(store.custom.map(w => [w, '', 'Sound it out slowly.']));
  else pool = SPELL[group];
  pool = shuffle(pool).sort((a, b) => (store.missed[b[0]] || 0) - (store.missed[a[0]] || 0)).slice(0, 8);
  sp = { q: shuffle(pool), i: 0, right: 0, phase: 'ask', hint: false, retried: new Set() };
  spellShow();
}
function spellShow() {
  if (sp.i >= sp.q.length) {
    const bonus = sp.right === sp.q.length ? 3 : 0; if (bonus) star(bonus);
    app.innerHTML = `${backBtn}<div class="card center"><div style="font-size:70px">🏆</div><h2>You spelled ${sp.right} of ${sp.q.length} on the first try!</h2>
    <p>${bonus ? 'Perfect round! +3 bonus stars!' : 'Words you missed will come back so you can master them.'}</p>
    <button onclick="spellMenu()">Play again</button></div>`; return;
  }
  const [w, s, tip] = sp.q[sp.i];
  app.innerHTML = `${backBtn}${bar(sp.i, sp.q.length)}
  <div class="card center">
    <p class="q">Word ${sp.i + 1} of ${sp.q.length}</p>
    <div class="row" style="justify-content:center"><button onclick="spSay()">🔊 Say the word</button>${s ? `<button class="sec" onclick="spSaySent()">💬 In a sentence</button>` : ''}<button class="sec" onclick="spHint()">💡 First letter</button></div>
    <p id="hint" style="font-size:28px;letter-spacing:6px;min-height:40px"></p>
    <input id="ans" type="text" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="type here" onkeydown="if(event.key==='Enter')spCheck()">
    <p><button class="good" onclick="spCheck()">Check ✔</button></p>
    <div id="msg" class="msg info" style="display:none"></div>
  </div>`;
  $('#ans').focus(); sp.phase = 'ask'; sp.hint = false; setTimeout(spSay, 300);
}
const spSay = () => say(sp.q[sp.i][0]);
const spSaySent = () => say(sp.q[sp.i][1]);
function spHint() { const w = sp.q[sp.i][0]; $('#hint').textContent = w[0] + ' ' + '_ '.repeat(w.length - 1); sp.hint = true; $('#ans').focus(); }
function spCheck() {
  const [w, s, tip] = sp.q[sp.i]; const a = $('#ans').value.trim().toLowerCase(); const m = $('#msg'); m.style.display = 'block';
  if (!a) return;
  if (a === w.toLowerCase()) {
    if (sp.phase === 'ask') { sp.right++; if (store.missed[w]) store.missed[w] = Math.max(0, store.missed[w] - 1); star(sp.hint ? 1 : 2); }
    m.className = 'msg ok';
    m.innerHTML = `${rc()} <b>${esc(w)}</b> ✔<br><small>${esc(tip)}</small><br><button onclick="sp.i++;spellShow()">Next →</button>`;
    $('#ans').disabled = true;

    if (sp.phase === 'ask') { store.missed[w] = (store.missed[w] || 0) + 1; save(); }

}

const POSS = ["The|adj brown|adj dog|n barked|v loudly|adv", "A|adj tiny|adj bird|n sang|v sweetly|adv", "The|adj hungry|adj bear|n caught|v a|adj fish|n",

let ps = null;
function posStart() {
  const qs = shuffle(POSS).slice(0, 8).map(s => { const kinds = [...new Set(s.map(w => w.p))]; return { s, target: kinds[Math.floor(Math.random() * kinds.length)] }; });

function posShow() {
  if (ps.i >= ps.qs.length) { app.innerHTML = `${backBtn}<div class="card center"><div style="font-size:70px">🎨</div><h2>${ps.score} of ${ps.qs.length} on the first try!</h2><button onclick="posStart()">Play again</button></div>`; return; }

function posTap(k) {
  const { s, target } = ps.qs[ps.i]; const el = document.querySelector(`.w[data-k="${k}"]`); const m = $('#msg');
  if (el.classList.contains(s[k].p)) return;

    if (!left) {

  }
}
const posNext = () => { ps.i++; posShow(); };

const SPS = ["The little girl|sang a happy song", "My dog|chased the squirrel", "Our teacher|reads to us every day", "The tall oak tree|fell in the storm",

let sps = null;
function spStart() { sps = { qs: shuffle(SPS).slice(0, 8), i: 0, score: 0, tries: 0 }; spShow(); }
function spShow() {

  const [a, b] = sps.qs[sps.i].split('|'); const w = (a + ' ' + b).split(' '); sps.tries = 0; sps.cut = a.split(' ').length;
  let html = ''; w.forEach((x, k) => { html += `<span>${esc(x)}</span>`; if (k < w.length - 1) html += `<span class="gap" data-g="${k + 1}" onclick="spTap(${k + 1})"></span>`; });

  <div id="msg" class="msg info">💡 The <b>subject</b> is who or what the sentence is about. The <b>predicate</b> tells what the subject does or is. Cover the predicate: what is left is the subject!</div>
  <button class="good" id="done" onclick="sps.i++;spShow()" style="display:none">Next →</button></div>`;

function spTap(g) {
  const m = $('#msg');

    if (sps.tries === 0) { sps.score++; star(1); }
    const [a, b] = sps.qs[sps.i].split('|');
    $('#sent').innerHTML = `<span class="subj">${esc(a)}</span> <span style="color:#999">|</span> <span class="pred">${esc(b)}</span>.`;

    $('#done').style.display = 'inline-block';
  } else {
    sps.tries++; m.className = 'msg no';
    m.textContent = g < sps.cut ? 'Not quite. The subject is bigger: include every word that describes who or what the sentence is about. Try again.' : 'Too far. Find the verb (the action). The subject comes just before the predicate begins. Try again.';
  }
}

/* ---------- SENTENCE DIAGRAMS ---------- */
/* w: words; S/V/O: head indexes; m: head -> modifier indexes; p: prepositional phrases {to, prep, obj, om} */
const D = (text, S, V, O, m, p, ot) => ({ w: text.split(' '), S, V, O, m: m || {}, p: p || [], ot: ot || 'obj' });
const LEVELS = [
  { name: "1. Subject + Verb", help: "Find the action (verb) first. Then ask: who or what did it? That is the subject. The subject goes on the left, the verb on the right, with a line between that crosses the baseline.",

  { name: "2. Adjectives", help: "Adjectives describe the noun. Each one goes on a slanted line under the word it describes. (A, an, the count!)",
    items: [D("The happy dog barked", 2, 3, null, { 2: [0, 1] }), D("A tiny bird sang", 2, 3, null, { 2: [0, 1] }), D("Big dogs bark", 1, 2, null, { 1: [0] }), D("The old clock stopped", 2, 3, null, { 2: [0, 1] }), D("Cold rain fell", 1, 2, null, { 1: [0] })] },
  { name: "3. Adverbs", help: "Adverbs describe the verb (how, when, where). They go on a slanted line under the verb.",
    items: [D("Dogs bark loudly", 0, 1, null, { 1: [2] }), D("The bird sang sweetly", 1, 2, null, { 1: [0], 2: [3] }), D("Children laugh often", 0, 1, null, { 1: [2] }), D("The tiny mouse ran quickly", 2, 3, null, { 2: [0, 1], 3: [4] }), D("Rain fell softly", 0, 1, null, { 1: [2] })] },
  { name: "4. Direct objects", help: "A direct object receives the action. Ask: verb + WHAT? Put it after the verb with a short line that stops at the baseline (it does not cross).",
    items: [D("Dogs chase cats", 0, 1, 2), D("The cat chased the mouse", 1, 2, 4, { 1: [0], 4: [3] }), D("Mia kicked the red ball", 0, 1, 4, { 4: [2, 3] }), D("The boy ate a sandwich", 1, 2, 4, { 1: [0], 4: [3] }), D("Grandma baked fresh cookies", 0, 1, 3, { 3: [2] })] },
  { name: "5. Prepositional phrases", help: "A prepositional phrase (on the couch) hangs under the word it describes. The preposition goes on the slanted line, and its object sits on a flat line. Adjectives hang under the object.",
    items: [D("The cat slept on the couch", 1, 2, null, { 1: [0] }, [{ to: 2, prep: 3, obj: 5, om: [4] }]),
      D("Birds fly over the tall trees", 0, 1, null, {}, [{ to: 1, prep: 2, obj: 5, om: [3, 4] }]),
      D("The dog ran into the yard", 1, 2, null, { 1: [0] }, [{ to: 2, prep: 3, obj: 5, om: [4] }]),
      D("Mia kicked the ball over the fence", 0, 1, 3, { 3: [2] }, [{ to: 1, prep: 4, obj: 6, om: [5] }]),
      D("The children played in the park", 1, 2, null, { 1: [0] }, [{ to: 2, prep: 3, obj: 5, om: [4] }])] },
  { name: "6. Linking verbs", help: "A linking verb (is, are, was, smells, looks...) links the subject to a word that renames it (predicate noun) or describes it (predicate adjective). That word goes after the verb on a slanted line that points back toward the subject.",
    items: [D("Billy is my friend", 0, 1, 3, { 3: [2] }, [], 'pn'), D("Mia is a good student", 0, 1, 4, { 4: [2, 3] }, [], 'pn'), D("Dogs are animals", 0, 1, 2, {}, [], 'pn'),
      D("The sky is blue", 1, 2, 3, { 1: [0] }, [], 'pa'), D("The soup smells delicious", 1, 2, 3, { 1: [0] }, [], 'pa'), D("Sam is our teacher", 0, 1, 3, { 3: [2] }, [], 'pn')] }
];
let dg = null;
function diagStart() {
  app.innerHTML = `${backBtn}<h2>📐 Sentence Diagrams</h2><p>Choose a level. Start at 1 and work your way up!</p>
  ${LEVELS.map((l, i) => `<div class="card menu-card" style="text-align:left;margin-bottom:12px" onclick="diagLevel(${i})"><h2>${l.name}</h2><p>${(store.ddone[i] || 0)} of ${l.items.length} done ${store.ddone[i] >= l.items.length ? '🌟' : ''}</p></div>`).join('')}`;
}
function diagLevel(l) { dg = { l, order: shuffle(LEVELS[l].items.map((_, i) => i)), n: 0 }; diagLoad(); }
function diagLoad() {
  if (dg.n >= dg.order.length) { app.innerHTML = `${backBtn}<div class="card center"><div style="font-size:70px">📐</div><h2>Level complete!</h2><button onclick="diagStart()">Pick a level</button></div>`; return; }
  const d = LEVELS[dg.l].items[dg.order[dg.n]]; dg.d = d; dg.sel = null; dg.placed = {}; dg.res = {}; dg.done = false; dg.slots = [];
  const slot = (kind, idx, grp, label) => { const id = dg.slots.length; dg.slots.push({ id, kind, exp: d.w[idx].toLowerCase(), grp: grp || ('s' + id), label }); return `[[${id}]]`; };
  const col = (h, kind, label) => {
    let x = `<div class="col">${slot(kind, h, null, label)}`;
    if ((d.m[h] || []).length) x += `<div class="mods">${d.m[h].map(i => slot('mod', i, 'g' + h, (h === d.V) ? 'adverb' : 'adjective')).join('')}</div>`;
    d.p.filter(p => p.to === h).forEach(p => {
      x += `<div class="prepwrap">${slot('prep', p.prep, null, 'preposition')}<div class="col pobj">${slot('pobj', p.obj, null, 'object')}`;
      if (p.om.length) x += `<div class="mods">${p.om.map(i => slot('mod', i, 'o' + p.obj, 'adjective')).join('')}</div>`;
      x += `</div></div>`;
    });
    return x + `</div>`;
  };
  let tpl = `<div class="main">${col(d.S, 'subj', 'subject')}<div class="vbar full"></div>${col(d.V, 'verb', 'verb')}`;
  if (d.O != null) { const lab = { obj: 'direct object', pn: 'predicate noun', pa: 'predicate adjective' }[d.ot]; tpl += `<div class="vbar ${d.ot === 'obj' ? 'half' : 'slant'}"></div>${col(d.O, d.ot, lab)}`; }
  tpl += `</div>`;
  dg.tpl = tpl; dg.chips = shuffle(d.w.map((t, i) => i)); dg.msg = ['info', '💡 Tap a word, then tap the spot where it belongs. Need help? Tap "Hint".'];
  diagRender();
}
function diagRender() {
  const d = dg.d;
  const usedChips = new Set(Object.values(dg.placed));
  const html = dg.tpl.replace(/\[\[(\d+)\]\]/g, (_, id) => {
    id = +id; const s = dg.slots[id]; const c = dg.placed[id];
    return `<div class="slot ${s.kind === 'mod' || s.kind === 'prep' ? s.kind : ''} ${dg.res[id] || ''} ${dg.sel != null && c == null ? 'sel-target' : ''}" onclick="diagSlot(${id})">${c != null ? esc(d.w[c]) : `<span class="ph">${s.label}</span>`}</div>`;
  });
  app.innerHTML = `${backBtn}${bar(dg.n, dg.order.length)}
  <div class="card"><p class="q center" style="font-size:26px">Diagram: <b>${esc(d.w.join(' '))}.</b></p>
  <div class="row" style="justify-content:center"><button class="sec" onclick="say('${esc(d.w.join(' '))}')">🔊 Hear it</button></div>
  <div class="diagram">${html}</div>
  <div class="bank">${dg.chips.map(i => `<button class="chip ${dg.sel === i ? 'sel' : ''} ${usedChips.has(i) ? 'used' : ''}" onclick="diagChip(${i})">${esc(d.w[i])}</button>`).join('')}</div>
  <div class="msg ${dg.msg[0]}">${dg.msg[1]}</div>
  <div class="row" style="justify-content:center">
   ${dg.done ? `<button class="good" onclick="dg.n++;diagLoad()">Next →</button>` : `<button class="good" onclick="diagCheck()">Check ✔</button><button class="sec" onclick="diagHint()">💡 Hint</button><button class="sec" onclick="diagShow()">👀 Show me</button><button class="sec" onclick="dg.placed={};dg.res={};dg.sel=null;diagRender()">↺ Clear</button>`}
  </div></div>`;
}
function diagChip(i) { if (Object.values(dg.placed).includes(i) || dg.done) return; dg.sel = dg.sel === i ? null : i; diagRender(); }
function diagSlot(id) {
  if (dg.done) return; delete dg.res[id];
  if (dg.sel != null) { dg.placed[id] = dg.sel; dg.sel = null; }
  else if (dg.placed[id] != null) delete dg.placed[id];
  diagRender();
}
function diagCheck() {
  const d = dg.d; const text = id => dg.placed[id] != null ? d.w[dg.placed[id]].toLowerCase() : null;
  if (Object.keys(dg.placed).length < dg.slots.length) { dg.msg = ['info', 'Put every word in the diagram first. Words left in the bank still need a spot.']; return diagRender(); }
  dg.res = {}; let bad = 0; const groups = {};
  dg.slots.forEach(s => { (groups[s.grp] = groups[s.grp] || []).push(s); });
  Object.values(groups).forEach(g => {
    const exp = g.map(s => s.exp).sort(), got = g.map(s => text(s.id)).sort();
    g.forEach(s => { const ok = g.length === 1 ? text(s.id) === s.exp : exp.includes(text(s.id)) && exp.join() === got.join(); dg.res[s.id] = ok ? 'ok' : 'bad'; if (!ok) bad++; });
  });
  if (!bad) {
    dg.done = true; dg.msg = ['ok', `${rc()} Perfect diagram!`]; star(2); store.ddone[dg.l] = Math.max(store.ddone[dg.l] || 0, dg.n + 1); save();
  } else {
    const firstBad = dg.slots.find(s => dg.res[s.id] === 'bad');
    dg.msg = ['no', `${bad} spot${bad > 1 ? 's' : ''} to fix (shown in red). Tap a red word to pick it back up. Look at the red ${firstBad.label} spot: ${tipFor(firstBad)}`];
  }
  diagRender();
}
function tipFor(s) {
  return ({ subj: 'who or what is the sentence about?', verb: 'which word is the action?', obj: 'verb + WHAT? The thing that receives the action.', pn: 'which noun after the linking verb renames the subject?', pa: 'which word after the linking verb describes the subject?', mod: 'which word does it describe? Adverbs describe the verb; adjectives describe nouns.', prep: 'which word shows position or direction (on, in, over...)?', pobj: 'what comes after the preposition?' })[s.kind];
}
function diagHint() {
  const d = dg.d; const first = dg.slots.find(s => dg.placed[s.id] == null);
  const h = [`Step 1: Find the verb (action): <b>${esc(d.w[d.V])}</b>. Put it on the right of the vertical line.`, `Step 2: Who or what ${esc(d.w[d.V])}? That is the subject: <b>${esc(d.w[d.S])}</b>.`];
  dg.msg = ['info', first && first.kind === 'verb' ? h[0] : first && first.kind === 'subj' ? h[1] : `Next empty spot is the <b>${first ? first.label : ''}</b>: ${first ? tipFor(first) : ''}<br><small>${esc(LEVELS[dg.l].help)}</small>`];
  diagRender();
}
function diagShow() {
  const d = dg.d; dg.placed = {}; const used = new Set();
  dg.slots.forEach(s => { const i = d.w.findIndex((w, k) => w.toLowerCase() === s.exp && !used.has(k)); used.add(i); dg.placed[s.id] = i; });
  dg.res = {}; dg.done = true; dg.msg = ['info', 'Here is the finished diagram. Study it, then try the next one on your own!']; diagRender();
}

/* ---------- start ---------- */
save(); home();
</script>
